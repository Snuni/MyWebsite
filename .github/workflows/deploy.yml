name: Deploy to 1&1 Webhosting via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sftp client
        run: npm install ssh2-sftp-client

      - name: Deploy all files to IONOS
        uses: actions/github-script@v7
        with:
          script: |
            const Client = require('ssh2-sftp-client');
            const sftp = new Client();
            const path = require('path');
            const fs = require('fs');
            
            const config = {
              host: process.env.FTP_SERVER,
              port: 22,
              username: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD
            };

            // Hilfsfunktion, um lokale Ordner rekursiv hochzuladen
            async function uploadDirectory(localDir, remoteDir) {
              // Stelle sicher, dass der Remote-Ordner existiert
              let remoteExists = await sftp.exists(remoteDir);
              if (!remoteExists) {
                await sftp.mkdir(remoteDir, true);
              }

              const items = fs.readdirSync(localDir, { withFileTypes: true });

              for (const item of items) {
                // Versteckte Ordner/Dateien wie .git, .github etc. überspringen
                if (item.name.startsWith('.')) continue;

                const localPath = path.join(localDir, item.name);
                const remotePath = `${remoteDir}/${item.name}`;

                if (item.isDirectory()) {
                  await uploadDirectory(localPath, remotePath);
                } else if (item.isFile()) {
                  console.log(`Uploading: ${item.name} -> ${remotePath}`);
                  await sftp.put(localPath, remotePath);
                }
              }
            }

            try {
              console.log('Connecting to IONOS SFTP...');
              await sftp.connect(config);
              console.log('Connected successfully!');

              console.log('Starting full repository upload...');
              // Lädt das aktuelle Verzeichnis (.) in das SFTP-Zielverzeichnis (.) hoch
              await uploadDirectory('.', '.');
              console.log('All files uploaded successfully!');

            } catch (err) {
              console.error('SFTP Error:', err);
              core.setFailed(err.message);
            } finally {
              await sftp.end();
            }
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
