name: Deploy to 1&1 Webhosting

on:
  push:
    branches:
      - main  # falls dein Hauptbranch 'master' heißt, bitte anpassen

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to 1&1 FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp: true               # Aktiviert SFTP statt FTP
          port: 22                 # Setzt den SFTP-Port
          server-dir: /public/     # Dein Pfad bei IONOS
          dangerous-clean-slate: true
