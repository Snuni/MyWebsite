name: Deploy to 1&1 Webhosting via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: cross-the-world/ssh-scp-ssh-pipeline@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          port: 22
          connect_timeout: 30s
          # Löscht den Inhalt von /public und lädt die aktuellen Dateien hoch
          rm_remote: true
          remote_path: /public/
          source: "."
